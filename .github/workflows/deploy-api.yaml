
name: Desplegar FastAPI MLOps Desaparecidos en Azure

on:
  push:
    branches: [main]
    paths:
      - 'azure/api/**'
      - '.github/workflows/deploy-api.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mlops-desaparecidos-api-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-mlops-ean
  ACR_NAME: acrmlopsean60126
  ENVIRONMENT_NAME: env-mlops-ean
  APP_NAME: api-mlops-desaparecidos
  IMAGE: acrmlopsean60126.azurecr.io/api-mlops-desaparecidos:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Autenticar en Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construir imagen Docker y publicar en ACR
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE" ./azure/api
          docker push "$IMAGE"

      - name: Crear o actualizar SOLO nuestra Container App
        env:
          DB_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          DB_APP_URL: ${{ secrets.DATABRICKS_APP_URL }}
          DB_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DB_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          SUB=$(az account show --query id -o tsv)
          LOCATION=$(az group show -n "$RESOURCE_GROUP" --query location -o tsv)
          ENV_ID="/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/$ENVIRONMENT_NAME"
          ARM_URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$APP_NAME?api-version=2024-03-01"
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)

          APP_JSON=$(mktemp)
          trap 'rm -f "$APP_JSON"' EXIT
          jq -n \
            --arg location "$LOCATION" \
            --arg env_id "$ENV_ID" \
            --arg image "$IMAGE" \
            --arg acr_server "$ACR_NAME.azurecr.io" \
            --arg acr_user "$ACR_NAME" \
            --arg acr_password "$ACR_PASSWORD" \
            --arg workspace "$DB_WORKSPACE_URL" \
            --arg app "$DB_APP_URL" \
            --arg client_id "$DB_CLIENT_ID" \
            --arg client_secret "$DB_CLIENT_SECRET" \
            --arg frontend_origin "https://stdesap1792649942.z22.web.core.windows.net" \
            '{
              location: $location,
              properties: {
                environmentId: $env_id,
                configuration: {
                  ingress: {
                    external: true,
                    targetPort: 8000,
                    allowInsecure: false
                  },
                  registries: [
                    {
                      server: $acr_server,
                      username: $acr_user,
                      passwordSecretRef: "acr-password"
                    }
                  ],
                  secrets: [
                    {name: "acr-password", value: $acr_password},
                    {name: "databricks-client-secret", value: $client_secret}
                  ]
                },
                template: {
                  containers: [
                    {
                      name: "api",
                      image: $image,
                      resources: {cpu: 0.5, memory: "1Gi"},
                      env: [
                        {name: "DATABRICKS_WORKSPACE_URL", value: $workspace},
                        {name: "DATABRICKS_APP_URL", value: $app},
                        {name: "DATABRICKS_CLIENT_ID", value: $client_id},
                        {name: "DATABRICKS_CLIENT_SECRET", secretRef: "databricks-client-secret"},
                        {name: "FRONTEND_ORIGIN", value: $frontend_origin}
                      ]
                    }
                  ],
                  scale: {minReplicas: 0, maxReplicas: 1}
                }
              }
            }' > "$APP_JSON"

          # Crear o actualizar exclusivamente nuestra Container App.
          az rest --method put --url "$ARM_URL" --body "@$APP_JSON" --output none

          for i in $(seq 1 36); do
            STATE=$(az rest --method get --url "$ARM_URL" --query properties.provisioningState -o tsv)
            echo "Provisionamiento: $STATE"

            if [ "$STATE" = "Succeeded" ]; then
              exit 0
            fi

            if [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
              exit 1
            fi

            sleep 10
          done

          echo 'Tiempo de aprovisionamiento agotado.' >&2
          exit 1

      - name: Verificar la nueva API en Azure
        run: |
          set -euo pipefail
          SUB=$(az account show --query id -o tsv)
          ARM_URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$APP_NAME?api-version=2024-03-01"

          FQDN=$(az rest --method get --url "$ARM_URL" --query properties.configuration.ingress.fqdn -o tsv)

          echo "API Azure: https://$FQDN"

          curl --fail-with-body \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 60 \
            -sS "https://$FQDN/health" | jq -e '.estado == "OK"'
