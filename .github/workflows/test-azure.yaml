name: Test Azure Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticacion Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar acceso a Azure
        run: |
          az group show \
            --name rg-mlops-ean \
            --query "{Nombre:name,Estado:properties.provisioningState}" \
            --output table